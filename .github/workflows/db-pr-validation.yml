name: "Database CI - PR Validation & Rollback Test"

on:
  pull_request:
    paths:
      - "changelog/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/db-pr-validation.yml"

jobs:
  validate-db:
    name: "Validate Migrations & Rollback"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: luminia_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Install PostGIS Extension on Service Container"
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c "apt-get update -qq && apt-get install -y -qq postgresql-16-postgis-3"

      - name: "Run Full Up & Down Rollback Test (Liquibase)"
        run: |
          docker run --rm \
            --network="host" \
            -v "${{ github.workspace }}/changelog:/liquibase/changelog" \
            -v "${{ github.workspace }}/config:/liquibase/config" \
            liquibase/liquibase:4.27-alpine \
            --url="jdbc:postgresql://localhost:5432/luminia_test_db" \
            --username="test_user" \
            --password="test_password" \
            --search-path="/liquibase/changelog" \
            --changelog-file="db.changelog-master.yaml" \
            update-testing-rollback
